<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>AR «Даг» — v4</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    body > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    canvas,
    canvas.a-canvas {
      background: transparent !important;
    }

    .a-enter-vr,
    .a-enter-vr-button,
    .a-enter-ar,
    .a-orientation-modal {
      display: none !important;
    }

    #status {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(88vw, 520px);
      box-sizing: border-box;
      padding: 11px 15px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    #version {
      position: fixed;
      z-index: 1001;
      top: 10px;
      right: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,.5);
      color: #fff;
      font: 12px/1 Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="version">AR v4</div>
  <div id="status">Запускаю камеру…</div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: no;
      uiLoading: yes;
      uiError: yes;

      filterMinCF: 0.0005;
      filterBeta: 10;

      warmupTolerance: 3;
      missTolerance: 10;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="20000">
      <a-asset-item id="dogModel" src="./dog.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      camera="near: 0.01; far: 1000">
    </a-camera>

    <!-- Более мягкое и равномерное освещение -->
    <a-light type="ambient" intensity="2.1"></a-light>
    <a-light
      type="hemisphere"
      color="#ffffff"
      groundColor="#777777"
      intensity="1.4"
      position="0 1 0">
    </a-light>
    <a-light
      type="directional"
      color="#ffffff"
      intensity="2.0"
      position="-1 2 3">
    </a-light>
    <a-light
      type="directional"
      color="#ffffff"
      intensity="1.0"
      position="2 1 1">
    </a-light>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!--
        dogPivot жёстко привязан к карточке.
        position 0 0 1.0 = лапы примерно на поверхности карточки.
        rotation 0 0 0 = направление относительно карточки фиксировано.
        Если потом захотим повернуть Дага на 90°, меняется только последняя цифра:
        rotation="0 0 90", "0 0 180" или "0 0 270".
      -->
      <a-entity
        id="dogPivot"
        position="0 0 1.0"
        rotation="0 0 0">

        <a-gltf-model
          id="dog"
          src="#dogModel"
          position="0 0 0"
          rotation="90 0 0"
          scale="2.0 2.0 2.0">
        </a-gltf-model>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const target = document.querySelector('#target');
    const dog = document.querySelector('#dog');
    const status = document.querySelector('#status');

    function forceCameraBehindAR() {
      const video = document.querySelector('body > video');
      if (video) {
        video.style.setProperty('z-index', '0', 'important');
        video.style.setProperty('position', 'fixed', 'important');
        video.style.setProperty('object-fit', 'cover', 'important');
      }

      if (scene && scene.canvas) {
        scene.canvas.style.setProperty('background', 'transparent', 'important');
      }
    }

    /*
      Чёрная шерсть в исходной модели очень тёмная.
      После загрузки слегка поднимаем "собственный свет" материала,
      сохраняя исходную текстуру.
    */
    dog.addEventListener('model-loaded', () => {
      const object = dog.getObject3D('mesh');

      if (object) {
        object.traverse((node) => {
          if (!node.isMesh || !node.material) return;

          const materials = Array.isArray(node.material)
            ? node.material
            : [node.material];

          materials.forEach((material) => {
            if (material.emissive) {
              material.emissive.setRGB(0.07, 0.07, 0.07);
              material.emissiveIntensity = 0.45;
              material.needsUpdate = true;
            }
          });
        });
      }
    });

    scene.addEventListener('renderstart', () => {
      forceCameraBehindAR();

      /* Небольшое повышение общей яркости 3D-рендера */
      if (scene.renderer) {
        scene.renderer.toneMappingExposure = 1.25;
      }
    });

    scene.addEventListener('arReady', () => {
      forceCameraBehindAR();
      status.style.opacity = '1';
      status.textContent = 'Камера готова. Наведите её на карточку «Даг».';
    });

    scene.addEventListener('arError', () => {
      status.style.opacity = '1';
      status.textContent = 'Не удалось запустить камеру. Проверьте разрешение камеры в браузере.';
    });

    target.addEventListener('targetFound', () => {
      forceCameraBehindAR();
      status.textContent = 'Карточка найдена.';
      setTimeout(() => {
        status.style.opacity = '0';
      }, 650);
    });

    target.addEventListener('targetLost', () => {
      status.style.opacity = '1';
      status.textContent = 'Карточка потеряна. Наведите камеру на «Дага» ещё раз.';
    });

    let checks = 0;
    const timer = setInterval(() => {
      forceCameraBehindAR();
      checks++;
      if (checks > 30) clearInterval(timer);
    }, 250);
  </script>
</body>
</html>
