<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR-карточка «Даг»</title>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(88vw, 520px);
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,.72);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">Разрешите доступ к камере и наведите её на карточку «Даг».</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="20000">
      <a-asset-item id="dogModel" src="./dog.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      camera="near: 0.01; far: 1000">
    </a-camera>

    <a-light type="ambient" intensity="1.4"></a-light>
    <a-light type="directional" intensity="1.8" position="-1 2 3"></a-light>

    <!-- targetIndex 0 = первая картинка, которую вы добавили в компилятор MindAR -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!--
        Для нашей модели:
        scale 0.9 — стартовый размер;
        rotation 90 0 0 — разворачивает собаку "из плоскости" карточки;
        position 0 0 0.45 — ставит основание модели примерно на поверхность карточки.
      -->
      <a-gltf-model
        id="dog"
        src="#dogModel"
        position="0 0 0.45"
        rotation="90 0 0"
        scale="0.9 0.9 0.9">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const status = document.querySelector('#status');

    target.addEventListener('targetFound', () => {
      status.textContent = 'Карточка найдена. AR-модель привязана к изображению.';
    });

    target.addEventListener('targetLost', () => {
      status.textContent = 'Карточка потеряна. Наведите камеру на «Дага» ещё раз.';
    });
  </script>
</body>
</html>
